    further-scratch:
      title: "المزيد عن برنامج سكراتش: الاستنساخ ، كتلتي ، والتحليل المنطقي"
      subtitle: "الاستنساخات، والكتل الخاصة بي، والمنطق البولياني"
      description: أبعد من ذلك مع Scratch تجاوز المهارات المقدمة في مقدمة إلى Scratch والمزيد من Scratch. ستقوم بإنشاء تطبيقات, ألعاب وفن تم إنشاؤه بواسطة الحاسوب، عمليات محاكاة باستخدام المنطق البوليني، الوظائف،الإستنساخ وأكتر من ذلك.
      meta_title: مسار المشروع | المزيد من Scratch للأطفال | Raspberry Pi
      meta_description: المزيد من البرمجة بواسطة Scratch للأطفال، المراهقين و الشباب. إستخدم هذه الموارد البرمجية المجانية لتستطيع إنشاء تطبيقات، ألعابا، أعمالا فنية منشأة بالحاسوب، و رسوما متحركة.
      header:
        - 
          title: "ماذا سأبتكر؟"
          content: |
            اصنع أعمالاً فنية وموسيقى وألعاباً ومحاكاة بواسطة الكمبيوتر.
            بحلول نهاية هذا المسار، ستكون قد استخدمت مهاراتك الجديدة لإنشاء محاكاة لمنظور الشخص الأول من خلال عالم خيالي.
        - 
          title: "ماذا أحتاج أن أعرف؟"
          content: |
            هذا المسار للمبدعين مرتاحين لاستخدام Scratch.
            إذا كنت جديداً على Scratch يمكنك تجربة مسار [مقدمة إلى Scratch](https://projects.raspberrypi.org/en/pathways/scratch-intro){:target="_blank"}.
        - 
          title: "ماذا أحتاج؟"
          content: |
            يتطلب هذا المسار:

            - كمبيوتر مكتبي أو كمبيوتر محمول أو جهاز لوحي أو جهاز محمول، أو جهاز كمبيوتر Raspberry Pi
            - الوصول إلى الإنترنت لاستخدام Scratch على الإنترنت أو القدرة على تنزيل وتثبيت Scratch. انظر [دليل إعداد Scratch](https://projects. aspberrypi.org/en/projects/getting-started-scratch/1){:target="_blank"} لمزيد من التفاصيل.
