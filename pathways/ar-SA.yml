          content: |
            ##321…اصنع!
            يتبع هذا المسار [321…اصنع!](https://projects.raspberrypi.org/en/projects/321-make-mentor-guide){:target="_blank"}:

            - **3 مشاريع استكشاف**: عرّف المبدعين على مجموعة من المهارات وقدم تعليمات خطوة بخطوة لمساعدتهم على تطوير الثقة الأولية.
            - **2 مشاريع تصميم**: اسمح للمبدعين بممارسة المهارات من مشاريع الاستكشاف والتعبير عن أنفسهم بشكل إبداعي أثناء نموهم في الاستقلال.
            - مشروع **1 ابتكار**: يشجع المبدعين على استخدام مهاراتهم لإنشاء مشروع فريد يلبي ملخص المشروع لجمهور معين.

            ##اختبار سريع
            يحتوي كل مشروع على اختبار سريع بثلاثة أسئلة اختيار من متعدد. يتم توجيه المبدعين إلى الإجابة الصحيحة من خلال ملاحظات مفيدة ويتم منحهم شارة المشروع.

            ##إلهام المجتمع
            يتم تشجيع المبدعين على إلهام الآخرين في مجتمع Raspberry Pi Foundation من خلال مشاركة مشاريع التصميم والاختراع الخاصة بهم معنا عبر [نموذج إرسال المشاريع](https://form.raspberrypi.org/f/community-project-submissions){:target="_blank"}. سيتم مشاركة المشاريع في معرض مجتمعنا.
