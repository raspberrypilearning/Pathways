    experience-ai-challenge-music-quest:
      title: "تجربة تحدي الذكاء الاصطناعي: مهمة الموسيقى"
      subtitle: "قم ببث الموسيقى التصويرية لحياتك باستخدام الذكاء الاصطناعي"
      description: The Experience AI Music Quest عبارة عن سلسلة من الجلسات التي ستعلمك كيفية تصميم وإنشاء "AI DJ" الخاص بك باستخدام Scratch وMachine Learning for Kids وSpotify API.
      meta_title: مسار المشروع | تحدي تجربة الذكاء الاصطناعي - Music Quest
      meta_description: مقدمة لبرمجة Scratch والتعلم الآلي للأطفال والمراهقين والشباب. تعلم كيفية تصنيف البيانات في نموذج التعلم الآلي واستخدامه للتنبؤ بالموسيقى التي ستحبها.
      header:
        - 
          title: "ماذا سأبتكر؟"
          content: |
            قم بإنشاء مشاريع Scratch تفاعلية وإنشاء نموذج التعلم الآلي وتدريبه.
            بحلول نهاية هذا المسار، ستكون قد استخدمت مهاراتك الجديدة لإنشاء تطبيق يمكنه إنشاء قوائم تشغيل للموسيقى بناءً على تفضيلاتك.
        - 
          title: "ماذا أحتاج أن أعرف؟"
          content: |
            يعد هذا المسار مثاليًا للمبتدئين في Scratch والتعلم الآلي.
        - 
          title: "ماذا أحتاج؟"
          content: |
            يتطلب هذا المسار:
            - جهاز كمبيوتر مكتبي أو كمبيوتر محمول أو جهاز لوحي أو جهاز محمول أو كمبيوتر Raspberry Pi
            - إمكانية الوصول إلى الإنترنت لاستخدام Scratch وMachine Learning 4 Kids عبر الإنترنت.
            - حساب [Machine Learning for Kids](https://machinelearningforkids.co.uk/#!/welcome){:target="_blank"}. (التعليمات متوفرة في دليل المرشد أدناه.)
            - سماعات رأس (موصى بها) أو مكبرات صوت
            - نسخة من [وثيقة Creator Blueprint](https://drive.google.com/uc?export=download&id=1T0ToSwRTA050AFpy1IJhbyvRdbv1rAQa){:target="_blank"}
        - 
          title: "معلومات المرشد"
          content: |
            ## تحدي تجربة الذكاء الاصطناعي: رحلة موسيقية

            يوفر هذا المسار المحتوى للمبدعين الشباب لبدء أولى محاولاتهم في الإبداع باستخدام التعلم الآلي والذكاء الاصطناعي كجزء من تحدي تجربة الذكاء الاصطناعي.

            يستغرق تحدي الموسيقى حوالي خمس ساعات من وقت المشروع لإكماله وهو مصمم ليكون مرنًا في التسليم - يمكن تشغيله كجلسات فردية أو "هاكاثون" ليوم واحد. يوفر المحتوى أيضًا فرصة لمواصلة العمل على المشاريع بين المراحل.

            يحتوي [دليل المرشد للرحلة](https://drive.google.com/uc?export=download&id=1XGlS9cMlke1-2ZzJYX3Uztezb_gMenIC) على تعليمات لإنشاء الحسابات المطلوبة، وتشغيل الملاحظات لكل مرحلة من مراحل الرحلة، بالإضافة إلى نصائح تصحيح الأخطاء واقتراحات للميزات الإضافية التي يمكن للمبدعين إضافتها.

            كما يحتوي على تعليمات لإرسال تطبيقات منشئي المحتوى النهائية إلى Experience AI Showcase، ليتم تقييمها وإدراجها في القائمة المختصرة من قبل لجنة من خبراء الصناعة والباحثين. سيتم دعوة المشاركين في القائمة المختصرة لحضور حدث العرض الخاص بنا، بالتعاون مع Google Deepmind!
    prepare-to-run-a-code-club:
      title: "الإعداد لتشغيل نادي البرمجة"
      subtitle: "خطواتك الأولى نحو إدارة نادي البرمجة للشباب."
      description: في هذه الدورة، سنقدم لك إرشادات خطوة بخطوة لبدء نادي البرمجة الخاص بك. سنبدأ بالتفاصيل العملية للتخطيط والإعداد، وسنرشدك خلال التخطيط وتقديم جلستك الأولى، وسنختتم بأفكار ونصائح حول كيفية تحفيز المتعلمين والاحتفال بإنجازاتهم.
      meta_title: مسار المشروع | الإعداد لتشغيل نادي البرمجة
      meta_description: في هذه الدورة، سنرشدك خلال عملية بدء نادي البرمجة الخاص بك، من الإعداد والتخطيط الأولي، إلى تقديم جلستك الأولى، وأخيرًا، تحفيز المتعلمين والاحتفال بإنجازاتهم.
      header:
        - 
          title: "ماذا سأتعلم؟"
          content: |
            في هذه الدورة، سوف نرشدك خلال عملية بدء نادي البرمجة الخاص بك، من الإعداد والتخطيط الأولي، إلى تقديم جلستك الأولى، وأخيرًا، تحفيز المتعلمين والاحتفال بإنجازاتهم.
        - 
          title: "ماذا أحتاج أن أعرف؟"
          content: |
            ستكون هذه الدورة مفيدة لك إذا كنت ترغب في التطوع في أحد النوادي في مجتمعك، لمساعدة الشباب على تعلم كيفية البرمجة، أو كنت مدرسًا يريد إنشاء نادي برمجة خارج المنهج الدراسي للطلاب في مدرستك.
        - 
          title: "ماذا أحتاج؟"
          content: |
            يتطلب هذا المسار:
            - جهاز كمبيوتر مكتبي أو كمبيوتر محمول أو جهاز لوحي أو جهاز محمول أو جهاز كمبيوتر Raspberry Pi
            - إمكانية الوصول إلى الإنترنت لاستخدام Scratch والتطبيقات الأخرى عبر الإنترنت.

