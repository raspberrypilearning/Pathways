ar:
  pathways:
    blender-basics:
      title: "Blender for beginners"
      subtitle: "Beginner projects for Blender."
      description: Learn the basics of how to use Blender to create, animate and render 3D objects and scenes.
      meta_title: Project path | Blender for beginners | 3D design for kids | 3D design | Practical projects
      meta_description: Introduction to Blender for kids, teenagers and young adults. Start creating 3D designs with these free resources.
      header:
        - 
          title: "What will I do?"
          content: |
            Add, edit and combine shapes to build, colour and render 3D models and animations.
        - 
          title: "What do I need to know?"
          content: |
            - Basic typing and computer navigation skills
        - 
          title: "What do I need?"
          content: |
            - A computer or mobile device capable of running [Blender](https://www.blender.org/download/){:target="_blank"}!
    raspberry-pi-beginners:
      title: "Raspberry Pi for beginners"
      subtitle: "Beginner projects for the Raspberry Pi."
      description: In this introduction to Raspberry Pi, you will learn how to set up and configure your Raspberry Pi. You will navigate the terminal, create bash scripts and automate tasks to run on boot and on a schedule!
      meta_title: Project path | Raspberry Pi for beginners | Raspberry Pi for kids | Practical projects using your Raspberry Pi
      meta_description: Introduction to Raspberry Pi and the terminal for kids, teenagers and young adults. Get the most out of your Raspberry Pi with these free resources.
      header:
        - 
          title: "What will I do?"
          content: |
            Set up your Raspberry Pi to suit your needs. Explore the terminal, create bash scripts and automate tasks to run on boot or on a timer.
        - 
          title: "What do I need to know?"
          content: |
            - Basic typing and computer navigation skills
        - 
          title: "What do I need?"
          content: |
            - A Raspberry Pi. We recommend using the latest model, but you can use any.
    ai-toolkit:
      title: "أدوات الذكاء الاصطناعي"
      subtitle: "تفاعل مع مجموعة من منصات الذكاء الاصطناعي والتعلم الآلي!"
      description: تقدم مجموعة أدوات الذكاء الاصطناعي تطبيقات وتقنيات الذكاء الاصطناعي المختلفة من خلال مشاريع عملية باستخدام منصات وأدوات مختلفة. ستعمل مع تقنيات التعرف على الصوت، والتعرف على الوجوه، وغيرها من تقنيات الذكاء الاصطناعي، مما سيمكنك من فهم أوسع لكيفية تطبيق الذكاء الاصطناعي في سياقات مختلفة.
      meta_title: مسار المشروع | مجموعة أدوات الذكاء الاصطناعي للأطفال | الذكاء الاصطناعي للأطفال | مشاريع عملية باستخدام التعرف على الصوت والوجه
      meta_description: مقدمة في الذكاء الاصطناعي وتعلم الآلة للأطفال والمراهقين والشباب. قم ببناء تطبيقات تستخدم الذكاء الاصطناعي باستخدام هذه الموارد المجانية.
      header:
        - 
          title: "ماذا سأبتكر؟"
          content: |
            أنشئ تطبيقات وألعاب تفاعلية تستخدم مصنفات الصور، والتعرف على الصوت والوجه. استكشف التقنيات المتقدمة مثل Adobe Firefly والأدوات العملية لإدارة نماذج Ollama و Stable Diffusion على Raspberry Pi.
        - 
          title: "ماذا أحتاج أن أعرف؟"
          content: |
            - مهارات الكتابة الأساسية والتنقل عبر الكمبيوتر
            - قد يكون من المفيد أيضًا التعرف على مسار [مقدمة إلى Scratch](https://projects.raspberrypi.org/en/pathways/scratch-intro){:target="_blank"}.
        - 
          title: "ماذا أحتاج؟"
          content: |
            هناك مجموعة من المشاريع التي يمكنك تجربتها والمتطلبات المحددة مدرجة لكل مشروع.
            - يمكن تنفيذ مشروع واحد كنشاط غير متصل بالإنترنت ويتم توفير جميع المواد القابلة للطباعة للتنزيل.
            - تتطلب معظم المشاريع جهاز كمبيوتر أو جهازًا محمولاً واتصالاً بالإنترنت.
            - تتطلب بعض المشاريع كاميرا ويب.
            - Raspberry Pi (اختياري).
            - micro:bit (اختياري).
        - 
          title: "معلومات المرشد"
          content: |
            ##اختر واختر
            ليست هناك حاجة لاتباع هذا المسار بالترتيب. يمكنك استكشاف الموضوع الذي يثير اهتمامك أكثر!

            ##متاح للجميع
            الشمولية هي جانب أساسي من هذه المجموعة. تلبي المشاريع مستويات مهارة مختلفة وتتضمن نشاطًا غير متصل بالإنترنت، مما يضمن مشاركة الجميع، بغض النظر عن الموارد المتاحة.

            ##دروس تعليمية بالفيديو
            يسعدنا أن نقدم مجموعة من المشاريع التي تتميز بكل من دروس الفيديو والأدلة المكتوبة خطوة بخطوة. تم تصميم دروس الفيديو لإرشادك خلال كل نشاط بالسرعة التي تناسبك وهي مصحوبة بتعليقات توضيحية لتحسين إمكانية الوصول. بالنسبة لأولئك الذين يفضلون التعليمات المكتوبة، تتوفر أيضًا أدلة مفصلة خطوة بخطوة.

            ##مشاريع أقصر
            صُممت المشاريع لتكون مرنة وجذابة ويمكن إكمال الجزء الرئيسي منها في بضع دقائق فقط، مما يترك الكثير من الوقت للتخصيص والاستكشاف. يسمح هذا الإعداد بجلسات قصيرة وممتعة يمكن دمجها بسهولة في أنشطة Code Club الخاصة بك.

            ##إلهام المجتمع
            يتم تشجيع المبدعين على إلهام الآخرين في مجتمع Raspberry Pi Foundation من خلال مشاركة مشاريعهم معنا.
    more-web:
      title: "المزيد من الويب"
      subtitle: "HTML وCSS وJavaScript!"
      description: تتعدى خطوات الويب الأساسية التي تم تقديمها في مقدمة عن الويب. لقد حوّل تصميم الويب الحديث مواقع الويب من جدران معلومات ثابتة ومملة إلى طرق لتوفير تجارب ممتعة وجذابة للمستخدم. اصطحب المستخدمين في رحلة وانقلهم إلى مكان جديد تمامًا!
      meta_title: مسار المشروع | مقدمة إلى HTML وCSS وJavaScript للأطفال | تطوير الويب للأطفال | إنشاء مواقع ويب تفاعلية
      meta_description: مقدمة إلى HTML و CSS و JavaScript للأطفال والمراهقين والشباب. بناء مواقع تفاعلية بهذه الموارد المجانية.
      header:
        - 
          title: "ماذا سأبتكر؟"
          content: |
            اصنع مواقع ويب تفاعلية مع أبطال خارقين وقصص تفاعلية ورحلة إلى القارة القطبية الجنوبية. تعلم كيفية استخدام الميزات التفاعلية مثل الرسوم المتحركة المتحركة وقوائم التنقل والأزرار وعناصر التحكم في الوضع الداكن.
            بحلول نهاية هذا المسار، ستكون قد استخدمت مهاراتك الجديدة لإنشاء موقع ويب تفاعلي لمشاركته مع أصدقائك.
        - 
          title: "ماذا أحتاج أن أعرف؟"
          content: |
            - مهارات الكتابة الأساسية والتنقل عبر الكمبيوتر
            - قد تكون الخبرة في HTML وCSS مفيدة
            - قد تكون المعرفة بمسار [مقدمة إلى الويب](https://projects.raspberrypi.org/en/pathways/web-intro){:target="_blank"} مفيدة أيضًا.
        - 
          title: "ماذا أحتاج؟"
          content: |
            - جهاز كمبيوتر أو جهاز محمول قادر على تشغيل منصة برمجة على الإنترنت. راجع [دليل البدء إلى محرر Raspberry Pi Editor](https://projects. aspberrypi.org/en/projects/getting-started-guide-editor-html){:target="_blank"}!
            - اختياري، حساب لحفظ المشاريع.
        - 
          title: "معلومات المرشد"
          content: |
            ##321…اصنع!
            يتبع هذا المسار [321…اصنع!](https://projects.raspberrypi.org/en/projects/321-make-mentor-guide){:target="_blank"}:

            - **3 مشاريع استكشاف**: عرّف المبدعين على مجموعة من المهارات وقدم تعليمات خطوة بخطوة لمساعدتهم على تطوير الثقة الأولية.
            - **2 مشاريع تصميم**: اسمح للمبدعين بممارسة المهارات من مشاريع الاستكشاف والتعبير عن أنفسهم بشكل إبداعي أثناء نموهم في الاستقلال.
            - مشروع **1 ابتكار**: يشجع المبدعين على استخدام مهاراتهم لإنشاء مشروع فريد يلبي ملخص المشروع لجمهور معين.

            ##اختبار سريع
            يحتوي كل مشروع على اختبار سريع بثلاثة أسئلة اختيار من متعدد. يتم توجيه المبدعين إلى الإجابة الصحيحة من خلال ملاحظات مفيدة ويتم منحهم شارة المشروع.

            ##إلهام المجتمع
            يتم تشجيع المبدعين على إلهام الآخرين في مجتمع Raspberry Pi Foundation من خلال مشاركة مشاريع التصميم والاختراع الخاصة بهم معنا عبر [نموذج إرسال المشاريع](https://form.raspberrypi.org/f/community-project-submissions){:target="_blank"}. سيتم مشاركة المشاريع في معرض مجتمعنا.
    microbit-intro:
      title: "مقدمة عن micro:bit"
      subtitle: "أجهزة الإستشعار والأزرار والأضواء!"
      description: في هذه المقدمة للبرمجة للمايكروبيت (micro:bit)، ستتعلم كيفية الإحساس والاستجابة للعالم من حولك أثناء الاعتناء بنفسك.
      meta_title: مسار المشروع | مقدمة إلى برمجة micro:bit للأطفال
      meta_description: مقدمة عن برمجة micro:bit للأطفال والمراهقين والشباب. تعلم كيفية إنشاء مشاريع micro:bit لمساعدتك على الاعتناء بنفسك.
      header:
        - 
          title: "ماذا سأبتكر؟"
          content: |
            اصنع مشاريع تفاعلية باستخدام المستشعرات والأزرار والأضواء الموجودة على micro:bit.
            بحلول نهاية هذا المسار، ستكون قد استخدمت مهاراتك الجديدة لإنشاء لعبة حفلات للعب ومشاركتها مع أصدقائك.
        - 
          title: "ماذا أحتاج أن أعرف؟"
          content: |
            يعد هذا المسار مثاليًا للمبتدئين في micro:bit.
        - 
          title: "ماذا أحتاج؟"
          content: |
            يتطلب هذا المسار:

            - كمبيوتر سطح مكتب أو كمبيوتر محمول أو جهاز لوحي أو جهاز محمول أو كمبيوتر Raspberry Pi
            - إمكانية الوصول إلى الإنترنت لاستخدام MakeCode عبر الإنترنت أو القدرة على تنزيل MakeCode وتثبيته. راجع [دليل البدء في استخدام micro:bit](https://projects.raspberrypi.org/en/projects/getting-started-guide-microbit){:target="_blank"} لمزيد من التفاصيل
            - اختياريًا، [حساب MakeCode](https://makecode.microbit.org/){:target="_blank"} وmicro:bit فعلي.
        - 
          title: "معلومات المرشد"
          content: |
            ##321…اصنع!
            يتبع هذا المسار [321…اصنع!](https://projects.raspberrypi.org/en/projects/321-make-mentor-guide){:target="_blank"}:

            - **3 مشاريع استكشاف**: عرّف المبدعين على مجموعة من المهارات وقدم تعليمات خطوة بخطوة لمساعدتهم على تطوير الثقة الأولية.
            - **2 مشاريع تصميم**: اسمح للمبدعين بممارسة المهارات من مشاريع الاستكشاف والتعبير عن أنفسهم بشكل إبداعي أثناء نموهم في الاستقلال.
            - مشروع **1 ابتكار**: يشجع المبدعين على استخدام مهاراتهم لإنشاء مشروع فريد يلبي ملخص المشروع لجمهور معين.

            ##اختبار سريع
            يحتوي كل مشروع على اختبار سريع بثلاثة أسئلة اختيار من متعدد. يتم توجيه المبدعين إلى الإجابة الصحيحة من خلال ملاحظات مفيدة ويتم منحهم شارة المشروع.

            ##إلهام المجتمع
            يتم تشجيع المبدعين على إلهام الآخرين في مجتمع Raspberry Pi Foundation من خلال مشاركة مشاريع التصميم والاختراع الخاصة بهم معنا عبر [نموذج إرسال المشاريع](https://form.raspberrypi.org/f/community-project-submissions){:target="_blank"}. سيتم مشاركة المشاريع في معرض مجتمعنا.
    scratch-intro:
      title: "مقدمة إلى Scratch: النقوش المتحركة، النصوص والحلقات"
      subtitle: "الكائنات والنصوص البرمجية والحلقات"
      description: في هذه المقدمة حول البرمجة في Scratch للمبتدئين، ستتعلم كيفية إضافة التعليمات البرمجية والمظاهر والأصوات إلى الكائنات أثناء إنشاء الرسوم المتحركة للعبة وتطبيق وكتاب.
      meta_title: مسار المشروع | مقدمة إلى البرمجة باستخدام برنامَج Scratch للأطفال
      meta_description: مقدمة عن برنامج Scratch للأطفال، المراهقين والشباب. تعرف على كيفية إنشاء رسوم متحركة ،لُعْبَة ،تطبيق وكتاب.
      header:
        - 
          title: "ماذا سأبتكر؟"
          content: |
            قم بإنشاء مشاريع تفاعلية ورسوم متحركة وإنشاء لعبة متعددة المستويات.
            بحلول نهاية هذا المسار، ستكون قد استخدمت مهاراتك الجديدة لتصبح مؤلفًا لكتاب رقمي يحتوي على صفحات متعددة.
        - 
          title: "ماذا أحتاج أن أعرف؟"
          content: |
            يعد هذا المسار مثاليًا للمبتدئين في Scratch.
        - 
          title: "ماذا أحتاج؟"
          content: |
            يتطلب هذا المسار:

            - كمبيوتر مكتبي أو كمبيوتر محمول أو جهاز لوحي أو جهاز محمول، أو جهاز كمبيوتر Raspberry Pi
            - الوصول إلى الإنترنت لاستخدام Scratch على الإنترنت أو القدرة على تنزيل وتثبيت Scratch. انظر [دليل إعداد Scratch](https://projects. aspberrypi.org/en/projects/getting-started-scratch/1){:target="_blank"} لمزيد من التفاصيل.
            - اختياري، [حساب Scratch](https://projects.raspberrypi.org/en/projects/getting-started-scratch/2){:target="_blank"}
        - 
          title: "معلومات المرشد"
          content: |
            ##321…Make!
            يتبع هذا المسار [321…Make!](https://projects.raspberrypi. rg/en/projects/321-make-mentor-guide){:target="_blank"}:

            - **3 Explore** مشاريع: تقديم المبدعين إلى مجموعة من المهارات وتقديم تعليمات خطوة خطوة لمساعدتهم على تطوير الثقة الأولية.
            - **2 مشروعات التصميم**: السماح للمبدعين بممارسة المهارات من مشاريع استكشاف، والتعبير عن أنفسهم بطريقة إبداعية أثناء نموهم في الاستقلال.
            - مشروع **1 Invent**: يشجع المبدعين على استخدام مهاراتهم لإنشاء مشروع فريد من نوعه يلتقي مع موجز المشروع لجمهور معين.

            ##الاختبار السريع
            كل مشروع يحتوي على اختبار سريع مع ثلاثة أسئلة متعددة الخيارات. يتم توجيه المبدعين إلى الإجابة الصحيحة من خلال ردود الفعل المفيدة ويمنحون شارة المشروع.

            ##إلهام المجتمع
            المبدعين يتم تشجيعهم على إلهام الآخرين في مجتمع مؤسسة Raspberry Pi عن طريق مشاركة مشاريعهم الخاصة بالتصميم والاستثمار معنا عبر [نموذج تقديم المشروع](https://form. aspberrypi.org/f/Community project-submissions){:target="_blank"}. سيتم مشاركة المشاريع مع معارض مجتمعنا.
            يمكنك معرفة كيفية [مشاركة المشاريع](https://projects.raspberrypi.org/en/projects/getting-started-scratch/19){:target="_blank"} في دليلنا
    more-scratch:
