            - **2 مشروعات التصميم**: السماح للمبدعين بممارسة المهارات من مشاريع استكشاف، والتعبير عن أنفسهم بطريقة إبداعية أثناء نموهم في الاستقلال.
            - مشروع **1 Invent**: يشجع المبدعين على استخدام مهاراتهم لإنشاء مشروع فريد من نوعه يلتقي مع موجز المشروع لجمهور معين.

            ##الاختبار السريع
            كل مشروع يحتوي على اختبار سريع مع ثلاثة أسئلة متعددة الخيارات. يتم توجيه المبدعين إلى الإجابة الصحيحة من خلال ردود الفعل المفيدة ويمنحون شارة المشروع.

