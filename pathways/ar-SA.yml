      title: "مقدمة إلى برنامج يونيتي(Unity): أجسام ثلاثية الأبعاد 3D ، وحدات التحكم في الشخصيات ، المصادمات ، نص وأزرار"
      subtitle: "الكائنات ثلاثية الأبعاد، ووحدات التحكم في الأحرف، والمصادمات، والنصوص والأزرار"
      description: في هذه المقدمة إلى يونيتي (Unity) سوف تتعلم كيفية صنع عوالم ثلاثية الأبعاد وألعاب بإستخدام المقتنيات، مؤقتات وشخصيات غير لاعب.
      meta_title: مسار المشروع | البرمجة بإسعمال برنامج يونيتي (Unity) للأطفال | Raspberry Pi
      meta_description: مقدمة إلى برمجة يونيتي للأطفال، المراهقين و اليافعين. تعلم كيف تصنع عوالم و ألعابا ثلاثية الأبعاد بإستعمال هذه الموارد المجانية.
      header:
        - 
          title: "ماذا سأبتكر؟"
          content: |
            اصنع عوالم وألعاب ثلاثية الأبعاد باستخدام العناصر القابلة للتجميع والمؤقتات والشخصيات غير القابلة للعب.
            بحلول نهاية هذا المسار، ستكون قد استخدمت مهاراتك الجديدة لإنشاء لعبة صائد النجوم، وعالم به مهام، ومغامرة ثلاثية الأبعاد.
        - 
          title: "ماذا أحتاج أن أعرف؟"
          content: |
            - مهارات الكتابة الأساسية والتنقل على الكمبيوتر
            - خبرة في البرمجة في [Scratch](https://projects.raspberrypi.org/en/pathways/scratch-intro){:target="_blank"} أو [Python](https://projects.raspberrypi.org/en/pathways/python-intro){:target="_blank"}
        - 
          title: "ماذا أحتاج؟"
          content: |
            يتطلب هذا المسار تنزيلًا وتثبيتًا كبيرًا يجب إكمالهما قبل بدء المشروع الأول.

            - تحتاج إلى تثبيت Unity Hub وUnity Editor لنظام التشغيل الخاص بك. يمكنك معرفة كيفية القيام بذلك في [دليل Unity](https://projects.raspberrypi.org/en/projects/unity-guide){:target="_blank"}.
            - ستحتاج أيضًا إلى محرر أكواد. المحرر الموصى به هو [Visual Studio](https://projects.raspberrypi.org/en/projects/unity-guide/3){:target="_blank"}.
            - ستحتاج أيضًا إلى تنزيل [حزمة بدء تشغيل Unity](https://rpf.io/p/en/explore-a-3d-world-go) للأصول قبل البدء.
        - 
          title: "معلومات المرشد"
          content: |
            ##321…اصنع!
            يتبع هذا المسار [321…اصنع!](https://projects.raspberrypi.org/en/projects/321-make-mentor-guide){:target="_blank"}:

            - **3 مشاريع استكشاف**: عرّف المبدعين على مجموعة من المهارات وقدم تعليمات خطوة بخطوة لمساعدتهم على تطوير الثقة الأولية.
            - **2 مشاريع تصميم**: اسمح للمبدعين بممارسة المهارات من مشاريع الاستكشاف والتعبير عن أنفسهم بشكل إبداعي أثناء نموهم في الاستقلال.
            - مشروع **1 ابتكار**: يشجع المبدعين على استخدام مهاراتهم لإنشاء مشروع فريد يلبي ملخص المشروع لجمهور معين.

            ##اختبار سريع
            يحتوي كل مشروع على اختبار سريع بثلاثة أسئلة اختيار من متعدد. يتم توجيه المبدعين إلى الإجابة الصحيحة من خلال ملاحظات مفيدة ويتم منحهم شارة المشروع.

            ##إلهام المجتمع
            يتم تشجيع المبدعين على إلهام الآخرين في مجتمع Raspberry Pi Foundation من خلال مشاركة مشاريعهم معنا عبر [نموذج إرسال المشاريع](https://form.raspberrypi.org/f/community-project-submissions){:target="_blank"}. سيتم مشاركة المشاريع بشكل مجهول في معارض مجتمعنا.
            يمكنك معرفة كيفية [مشاركة المشاريع](https://projects.raspberrypi.org/en/projects/unity-guide/5){:target="_blank"} في دليلنا.
