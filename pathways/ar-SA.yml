    scratch-machine-learning:
      title: "التعلم الآلي باستخدام Scratch"
      subtitle: "مشاريع التعلم الآلي التمهيدية باستخدام التعلم الآلي للأطفال باستخدام Scratch."
      description: مقدمة للمفاهيم الأساسية للتعلم الآلي من خلال مشاريع إبداعية وتفاعلية. سيقوم المبدعون بتدريب النماذج للتعرف على الأنماط في الصور والنصوص والصوت، واستكشاف كيفية استخدام هذه النماذج لإنشاء ألعاب ممتعة!
      meta_title: مسار المشروع | التعلم الآلي باستخدام Scratch | التعلم الآلي للأطفال | مشاريع عملية باستخدام التعرف على الصوت والوجه
      meta_description: مدخل إلى الذكاء الاصطناعي وتعلم الآلات للأطفال والمراهقين والشباب. بناء تطبيقات تستخدم تعلم الآلات بهذه الموارد المجانية.
      header:
        - 
          title: "ماذا سأبتكر؟"
          content: |
            اصنع مشاريع إبداعية وتفاعلية باستخدام التعرف على الصوت والتعرف على الوجه. سيقوم المبدعون بتدريب النماذج على التعرف على الأنماط، والتنبؤ، واستكشاف كيفية تحسين هذه النماذج باستخدام بيانات إضافية.
        - 
          title: "ماذا أحتاج أن أعرف؟"
          content: |
            - مهارات التنقل الأساسية في الكتابة والكمبيوتر
            - معرفة مسار [مقدمة إلى Scratch](https://projects.raspberrypi.org/en/pathways/scratch-intro){:target="_blank"} قد يكون مفيداً أيضاً.
        - 
          title: "ماذا أحتاج؟"
          content: |
            هناك مجموعة من المشاريع التي يمكنك تجربتها والمتطلبات المحددة مدرجة لكل مشروع.
            - تتطلب جميع المشاريع جهاز كمبيوتر أو جهاز محمول واتصال بالإنترنت.
            - تتطلب بعض المشاريع كاميرا ويب.
        - 
          title: "معلومات المرشد"
          content: |
            ##اختر و اختر
            لا حاجة لاتباع هذا المسار بالترتيب. يمكنك استكشاف السمة التي تهمك أكثر!

            ##متاح لجميع
            الشمولية هو جانب رئيسي من هذه المجموعة. وتغطي المشاريع مختلف مستويات المهارات، بما يكفل مشاركة الجميع.

            ##فيديو دروس
            نحن متحمسون لتقديم مجموعة من المشاريع التي تحتوي على دروس فيديو وأدلة مكتوبة خطوة بخطوة. تم تصميم دروس الفيديو لتوجيهك من خلال كل نشاط بالوتيرة الخاصة بك ويتم التقاط هذه الدروس لتحسين إمكانية الوصول. وتتاح أيضا لأولئك الذين يفضلون إصدار تعليمات خطية أدلة مفصلة على أساس الخطوة.

            ##مشاريع أقصر
            تصمم المشاريع لتكون مرنة ومشاركة، ويمكن إكمال الجزء الرئيسي في بضع دقائق، ترك الكثير من الوقت للتخصيص والاستكشاف. يتيح هذا الإعداد جلسات قصيرة وممتعة يمكن دمجها بسهولة في أنشطة نادي البرمجة الخاص بك.

            ##إلهام المجتمع
            المبدعين يتم تشجيعهم على إلهام الآخرين في مجتمع مؤسسة Raspberry Pi عن طريق مشاركة مشاريعهم معنا.
